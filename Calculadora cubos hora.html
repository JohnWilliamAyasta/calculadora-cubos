<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de Cubos por Hora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: una sola tarjeta de trabajo, pensada para el celular: dato arriba, resultado grande abajo */
  :root {
    --bg: #eef0ec;
    --surface: #ffffff;
    --fg: #22261f;
    --muted: #63695d;
    --line: #d5d9cf;
    --accent: #d9821e;      /* naranja de maquinaria */
    --accent-ink: #1d1a14;
    --result-bg: #262a22;
    --result-fg: #f4f1e6;
    --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --font-body: "Barlow", "Segoe UI", Arial, sans-serif;
    --font-mono: "JetBrains Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161814; --surface: #20231d; --fg: #ebeee6; --muted: #a2a898; --line: #393e33;
      --accent: #f0a043; --accent-ink: #1d1a14; --result-bg: #0f110d; --result-fg: #f4f1e6; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161814; --surface: #20231d; --fg: #ebeee6; --muted: #a2a898; --line: #393e33;
    --accent: #f0a043; --accent-ink: #1d1a14; --result-bg: #0f110d; --result-fg: #f4f1e6; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 40px;
  }
  main { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  main > * { min-width: 0; }
  .field input { width: 100%; }

  header { display: grid; gap: 4px; }
  .eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1.05; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
  label { font-weight: 600; display: block; margin-bottom: 6px; }
  .hint { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
  .field { display: flex; align-items: stretch; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
  .field:focus-within { border-color: var(--accent); }
  .field input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); padding: 12px 14px;
    font-family: var(--font-mono); font-size: 1.6rem; font-variant-numeric: tabular-nums; outline: none;
  }
  .field span { display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-weight: 600; border-left: 1px solid var(--line); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    font: inherit; font-size: 0.9rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); cursor: pointer;
  }
  .chips button:hover { border-color: var(--accent); }
  .chips button:focus-visible, .copy:focus-visible, details summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .result { background: var(--result-bg); color: var(--result-fg); border-radius: 14px; padding: 20px 18px; display: grid; gap: 6px; }
  .result .label { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.9rem; opacity: 0.8; }
  .big { font-family: var(--font-display); font-weight: 700; font-size: 4.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .big small { font-size: 1.4rem; font-weight: 600; margin-left: 6px; opacity: 0.85; }
  .result .err { color: var(--accent); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.95rem; opacity: 0.9; }
  .row b { font-variant-numeric: tabular-nums; }
  .copy {
    justify-self: start; margin-top: 6px; font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 0;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }

  details { border-top: 1px solid var(--line); padding-top: 12px; }
  details summary { cursor: pointer; font-weight: 600; }
  .formula { font-family: var(--font-mono); font-size: 0.95rem; background: var(--bg); border-radius: 8px; padding: 10px 12px; margin: 10px 0 6px; overflow-x: auto; }
  footer { font-size: 0.85rem; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: no-preference) { .big { transition: color .2s; } }
</style>
</head>
<body>

<main>
  <header>
    <span class="eyebrow">Producción de agregados</span>
    <h1>Cubos producidos por hora</h1>
    <p>Mide cuántos segundos toma llenar 0.2 m³ y obtén los m³ por hora.</p>
  </header>

  <section class="card" aria-label="Datos">
    <div>
      <label for="seg">Tiempo medido</label>
      <div class="field">
        <input id="seg" type="number" inputmode="decimal" min="0" step="any" value="19">
        <span>seg</span>
      </div>
    </div>
  </section>

  <section class="result" aria-live="polite">
    <span class="label">Cubos producidos por hora</span>
    <div class="big" id="out">37.9<small>m³/h</small></div>
    <div class="row" id="extra">
      <span>Por minuto: <b id="min">0.63</b> m³</span>
      <span>Por día (<span id="hrsl">8</span> h): <b id="dia">303.2</b> m³</span>
    </div>
    <button class="copy" id="copy" type="button">Copiar resultado</button>
  </section>

  <footer>Ejemplo cargado: 19 segundos. Cambia el tiempo y el resultado se actualiza solo.</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const VOL = 0.2, HORAS = 8; // m³ por medida y horas por día, igual que el Excel
  const fmt = (n, d) => n.toLocaleString('es-PE', { minimumFractionDigits: d, maximumFractionDigits: d });
  function calc() {
    const s = parseFloat($('seg').value), v = VOL, h = HORAS;
    const out = $('out');
    if (!(s > 0) || !(v > 0)) {
      out.innerHTML = '<span class="err">Ingresa segundos mayores a 0</span>';
      $('extra').hidden = true; $('copy').hidden = true; return null;
    }
    const mh = (v / s) * 3600;
    out.innerHTML = fmt(mh, 1) + '<small>m³/h</small>';
    $('min').textContent = fmt(mh / 60, 2);
    $('hrsl').textContent = h > 0 ? fmt(h, h % 1 ? 1 : 0) : '0';
    $('dia').textContent = fmt(h > 0 ? mh * h : 0, 1);
    $('extra').hidden = false; $('copy').hidden = false;
    return { s, v, h, mh };
  }
  $('seg').addEventListener('input', calc);
  $('copy').addEventListener('click', async () => {
    const r = calc(); if (!r) return;
    const txt = `Tiempo: ${fmt(r.s, r.s % 1 ? 1 : 0)} s por ${r.v} m³ → ${fmt(r.mh, 1)} m³/h` + (r.h > 0 ? ` (${fmt(r.mh * r.h, 1)} m³ en ${r.h} h)` : '');
    const btn = $('copy');
    try { await navigator.clipboard.writeText(txt); btn.textContent = 'Copiado'; }
    catch { const sel = window.getSelection(); const rng = document.createRange(); rng.selectNodeContents($('out')); sel.removeAllRanges(); sel.addRange(rng); btn.textContent = 'Seleccionado: copia con Ctrl+C'; }
    setTimeout(() => (btn.textContent = 'Copiar resultado'), 1800);
  });
  calc();
</script>
</body>
</html>
